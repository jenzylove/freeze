name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests (pricing, payout and calldata math)
        working-directory: plugin
        run: node --test "test/*.test.ts"
      - name: Site scripts parse
        run: for f in web/js/*.js; do node --check "$f"; done
